[project]
name = "halloween-engine"
version = "0.1.0"
description = "Moteur d'exécution de la déco Halloween (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
halloween-cli = "halloween.cli:console"

[project.optional-dependencies]
# Pilotes GPIO, uniquement nécessaires sur le Raspberry Pi
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
]

[dependency-groups]
dev = [
    # gpiozero seul (sans lgpio) suffit aux tests : ils utilisent sa fabrique de broches fictive.
    "gpiozero>=2.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halloween"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
